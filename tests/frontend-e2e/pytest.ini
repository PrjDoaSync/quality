[pytest]
# Descoberta de testes
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Relatorio HTML e saida verbosa
addopts = -v --html=reports/report.html --self-contained-html

# Marcadores para organizar a suite por tipo de cenario (ADR-002)
markers =
    smoke: cenarios rapidos de fumaca (saude basica da UI)
    e2e: fluxos ponta a ponta (campanha -> doacao -> dashboard)
    negativo: cenarios de excecao e validacao
